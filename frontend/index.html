<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediKiosk — AI-Powered Multilingual Patient Case-Taking Platform</title>
    <meta name="description" content="MediKiosk — Realistic Hospital & OPD AI-Powered Multilingual Patient Case-Taking Platform for SIH 2026. General Medical & AYUSH intake, OCR, timeline, and doctor review." />
    <!-- Google Fonts: Inter, Noto Sans Telugu, Noto Sans Devanagari -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F3F8F8] text-[#172033] font-sans antialiased selection:bg-[#0EA5A8] selection:text-white min-h-screen">
    <!-- Hidden Universal Website Translator Engine -->
    <div id="google_translate_element" style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; overflow: hidden; z-index: -999;"></div>
    <div id="root"></div>

    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        try {
          new google.translate.TranslateElement({
            pageLanguage: 'en',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          }, 'google_translate_element');
        } catch (e) {
          console.warn('Translate element init notice:', e);
        }
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async defer></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
